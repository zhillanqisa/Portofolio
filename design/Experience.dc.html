<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #f6f5f2; -webkit-font-smoothing: antialiased; }
  a { color: #20201e; text-decoration: none; }
  a:hover { color: #000; }
  ::selection { background: #e3e1da; }
  html { scroll-behavior: smooth; }
  @keyframes zq-rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes zq-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes zq-dot { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: none; } }
  [data-reveal] { opacity: 0; }
  [data-reveal].zq-in { animation: zq-rise 0.85s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
  [data-timeline] { transform: scaleY(0); transform-origin: top; }
  [data-timeline].zq-in { animation: zq-grow 1.4s cubic-bezier(0.19, 1, 0.22, 1) 0.1s forwards; }
  [data-dot] { opacity: 0; }
  [data-dot].zq-in { animation: zq-dot 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  [data-back] { transition: gap 0.3s cubic-bezier(0.19,1,0.22,1), color 0.25s ease; }
  [data-back]:hover { gap: 14px; color: #20201e; }

  html.zq-dark { background: #131315; }
  html.zq-dark body { background: #131315; }
  html.zq-dark [data-page] { background: #141416 !important; }
  [data-theme-scope] { filter: invert(0) hue-rotate(0deg); transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
  html.zq-dark [data-theme-scope] { filter: invert(0.93) hue-rotate(180deg); }
  html.zq-dark [data-theme-scope] img { filter: invert(1) hue-rotate(180deg); }
  [data-themebtn] svg { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; }
  [data-themebtn][data-on="dark"] svg { transform: rotate(140deg); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    [data-reveal], [data-dot] { opacity: 1; }
    [data-timeline] { transform: none; }
  }
</style>
</helmet>
<div data-page="" style="font-family: 'Plus Jakarta Sans', Helvetica, Arial, sans-serif; color: #20201e; background: #f6f5f2; min-height: 100vh; font-size: 16px; line-height: 1.55;">

  <header data-theme-scope="" style="position: sticky; top: 0; z-index: 10; background: rgba(246,245,242,0.6); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); -webkit-mask-image: linear-gradient(180deg, #000 62%, rgba(0,0,0,0.55) 82%, transparent); mask-image: linear-gradient(180deg, #000 62%, rgba(0,0,0,0.55) 82%, transparent);">
    <div style="max-width: 1080px; margin: 0 auto; padding: 16px 32px 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
      <a href="Zhillan Zhahiran - Portfolio.dc.html" style="font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: #20201e;">ZQZ</a>
      <nav style="display: flex; align-items: center; gap: 10px 22px; font-size: 14.5px; flex-wrap: wrap;">
        <span style="color: #20201e; font-weight: 600;">Experience</span>
        <a href="Zhillan Zhahiran - Portfolio.dc.html#work" style="color: #8a887f;" style-hover="color: #20201e;">Work</a>
        <a href="Zhillan Zhahiran - Portfolio.dc.html#skills" style="color: #8a887f;" style-hover="color: #20201e;">Tools</a>
        <span style="width: 1px; height: 18px; background: #d5d3cc;"></span>
        <a href="Zhillan Zhahiran - Portfolio.dc.html#contact" aria-label="Contact" style="color: #8a887f; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px;" style-hover="color: #20201e; background: rgba(32,32,30,0.06);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" /><path d="M2.5 6l9.5 7 9.5-7" /></svg></a>
        <div onClick="{{ toggleTheme }}" data-themebtn="" data-on="{{ themeMode }}" role="button" tabindex="0" aria-label="Toggle dark mode" title="Toggle dark mode" style="cursor: pointer; color: #8a887f; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px;" style-hover="color: #20201e; background: rgba(32,32,30,0.06);">{{ themeIcon }}</div>
      </nav>
    </div>
  </header>

  <section data-theme-scope="" style="max-width: 1080px; margin: 0 auto; padding: 44px 32px 96px;">
    <a href="Zhillan Zhahiran - Portfolio.dc.html" data-back="" style="display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; color: #8a887f;">
      <span style="font-size: 15px;">‹</span><span>Back to Home</span>
    </a>

    <div style="margin-top: 44px; display: grid; gap: 8px;">
      <h1 style="margin: 0; font-size: clamp(38px, 5.6vw, 60px); line-height: 1.02; font-weight: 500; letter-spacing: -0.035em;">Experience</h1>
      <p style="margin: 0; font-size: 16.5px; color: #8a887f; max-width: 60ch; text-wrap: pretty;">Where I have worked and what I did there.</p>
    </div>

    <div style="margin-top: 56px; position: relative; padding-left: 30px;">
      <span data-timeline="" style="position: absolute; left: 5px; top: 8px; bottom: 8px; width: 1px; background: #dcdad3;"></span>
      <div style="display: grid; gap: 52px;">
        <sc-for list="{{ roles }}" as="role" hint-placeholder-count="3">
          <div data-reveal="" style="position: relative;">
            <span data-dot="" style="position: absolute; left: -30px; top: 7px; width: 11px; height: 11px; border-radius: 50%; background: #20201e;"></span>
            <div style="font-size: 13.5px; font-weight: 600; color: #a19e95; letter-spacing: 0.01em;">{{ role.dates }}</div>
            <div style="margin-top: 3px; font-size: 22px; font-weight: 700; letter-spacing: -0.025em;">{{ role.title }}</div>
            <div style="margin-top: 3px; font-size: 15px; font-weight: 600; color: #45443f;">{{ role.org }}</div>
            <div style="margin-top: 2px; font-size: 15px; color: #8a887f;">{{ role.place }}</div>
            <div style="margin-top: 18px; display: grid; gap: 12px;">
              <sc-for list="{{ role.points }}" as="pt" hint-placeholder-count="3">
                <div style="display: flex; gap: 13px; align-items: baseline;">
                  <span style="flex: 0 0 5px; width: 5px; height: 5px; border-radius: 50%; background: #c2bfb7; transform: translateY(-3px);"></span>
                  <span style="font-size: 15.5px; line-height: 1.6; color: #55534d; max-width: 78ch; text-wrap: pretty;">{{ pt.text }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <div data-theme-scope="" style="max-width: 1080px; margin: 0 auto; padding: 0 32px 72px;">
    <a href="Zhillan Zhahiran - Portfolio.dc.html#work" style="display: inline-flex; align-items: center; gap: 10px; font-size: 14.5px; color: #8a887f;" data-back="" style-hover="color: #20201e;"><span>See selected work</span><span style="font-size: 15px;">›</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { dark: false };

  componentDidMount_theme() {
    let d = false;
    try { d = localStorage.getItem('zqz-theme') === 'dark'; } catch (e) {}
    document.documentElement.classList.toggle('zq-dark', d);
    this.setState({ dark: d });
  }
  toggleTheme = () => this.setState((st) => {
    const d = !st.dark;
    document.documentElement.classList.toggle('zq-dark', d);
    try { localStorage.setItem('zqz-theme', d ? 'dark' : 'light'); } catch (e) {}
    return { dark: d };
  });
  themeIcon() {
    const dark = this.state.dark;
    const c = React.createElement;
    return c('svg', { width: 17, height: 17, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.7, 'aria-hidden': true },
      dark
        ? c('path', { key: 'm', d: 'M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z' })
        : [
            c('circle', { key: 'c', cx: 12, cy: 12, r: 4.2 }),
            c('path', { key: 'r', d: 'M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6' })
          ]
    );
  }

  componentDidMount() {
    this.componentDidMount_theme();
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('zq-in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    const scan = () => document.querySelectorAll('[data-reveal], [data-timeline], [data-dot]').forEach((el) => {
      if (!el.classList.contains('zq-in')) io.observe(el);
    });
    this._scan = scan;
    scan();
    this._t = setTimeout(scan, 500);
  }
  componentDidUpdate() { if (this._scan) this._scan(); }
  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const data = [
      ['July 2025 – Aug 2025', 'Urban Planning Intern', 'PT. Dananjaya Design Indonesia', 'West Bandung, Indonesia', [
        'Produced GIS-based thematic maps for 16 sub-districts in West Bandung Regency using QGIS and ArcGIS Pro.',
        'Developed income and population projections from BPS data using linear and geometric methods.',
        'Prepared base maps covering geology, morphology, land cover, spatial pattern, power networks, and population density.',
        'Work supported a government-commissioned programme to develop tourism villages (desa wisata).'
      ]],
      ['Mar 2025 – Mar 2026', 'Junior Staff, Training & Development', 'Association of Planning Engineering Students (HMTP)', 'Diponegoro University, Semarang', [
        'Person in charge of Plano Pustaka, sharing lecture materials and elective-course information with department students.',
        'Reached 90% availability of materials shared by lecturers.'
      ]],
    ];
    return {
      themeMode: this.state.dark ? 'dark' : 'light',
      themeIcon: this.themeIcon(),
      toggleTheme: this.toggleTheme,
      roles: data.map((r) => ({
        dates: r[0], title: r[1], org: r[2], place: r[3],
        points: r[4].map((t) => ({ text: t }))
      }))
    };
  }
}
</script>
</body>
</html>
